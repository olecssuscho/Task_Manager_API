name: Uvi_test

on: [push]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v6
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.14"
            
        - name: Test
          run: | 
            python -m pip install --upgrade pip
            python install -r requirements.txt
            uvicorn main:app --host 0.0.0.0 --port 80
            